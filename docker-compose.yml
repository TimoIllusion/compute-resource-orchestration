version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gpu_orchestrator_api
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gpu_orchestrator_ui
    ports:
      - "8080:80" # Map host port 8080 to container port 80 (nginx)
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
      
  gpu_worker_1:
    build:
      context: ./gpu_workers
      dockerfile: Dockerfile
    container_name: gpu_worker_1
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=0
      - NODE_ID=node1
      - GPU_ID=0
      - BACKEND_URL=http://backend:8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    depends_on:
      - backend
      
  gpu_worker_2:
    build:
      context: ./gpu_workers
      dockerfile: Dockerfile
    container_name: gpu_worker_2
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=0
      - NODE_ID=node1
      - GPU_ID=0
      - BACKEND_URL=http://backend:8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    depends_on:
      - backend
