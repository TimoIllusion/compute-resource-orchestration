version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gpu_orchestrator_api
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      # Add any production-specific environment variables here
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gpu_orchestrator_ui
    ports:
      - "8080:80" # Map host port 8080 to container port 80 (nginx)
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Point the Vue app to the backend API - modify this URL for production
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
