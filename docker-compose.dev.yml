version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gpu_orchestrator_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app  # Mount current directory for hot reloading
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: gpu_orchestrator_ui
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app  # Mount for hot reloading
      - /app/node_modules  # Don't mount local node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8000
    command: npm run dev

  gpu_worker_1:
    build:
      context: ./gpu_workers
      dockerfile: Dockerfile
    container_name: gpu_worker_1
    restart: unless-stopped
    volumes:
      - ./gpu_workers:/app  # Mount for easier development
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=0
      - NODE_ID=node1
      - GPU_ID=0
      - DEV_MODE=1
      - BACKEND_URL=http://backend:8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    depends_on:
      - backend
      
  gpu_worker_2:
    build:
      context: ./gpu_workers
      dockerfile: Dockerfile
    container_name: gpu_worker_2
    restart: unless-stopped
    volumes:
      - ./gpu_workers:/app  # Mount for easier development
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=1
      - NODE_ID=node1
      - GPU_ID=1
      - DEV_MODE=1
      - BACKEND_URL=http://backend:8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    depends_on:
      - backend
